app = "darkrevolution"
primary_region = "fra"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # World state lives in memory: keep exactly one machine running, never auto-stop.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
